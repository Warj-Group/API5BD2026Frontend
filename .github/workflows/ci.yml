name: Frontend CI & SonarCloud

on:
  push:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Necessário para o SonarCloud analisar o histórico de commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # A análise do Sonar só começa se os passos acima (Lint/Typecheck) derem sucesso.
      - name: SonarCloud Scan
        # Substituímos @master pelo hash estável da versão v3.1.0
        uses: SonarSource/sonarcloud-github-action@db501078e937e4fd9c9e42994406022819776090
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}