name: Frontend CI & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]

    steps:
      - name: Checkout
        # v4.2.2 (Este funcionou no seu log anterior)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
        with:
          fetch-depth: 0

      - name: Install Node.js
        # Trocamos para o SHA da v4.1.0 (Mais estável para resolução de tarball)
        uses: actions/setup-node@39225597ea6c387142ff13f3ca09bd3316698622 
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm via Corepack
        # Evita erro 404 usando o gerenciador nativo do Node
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  sonarcloud:
    name: SonarCloud Scan
    needs: ci # Garante que só analisa se o código estiver íntegro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        # v4.2.1
        uses: SonarSource/sonarqube-scan-action@724367c337b56d3575971a1792ca8a221f736024
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}