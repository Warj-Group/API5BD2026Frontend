name: Frontend CI & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
    types: [opened, synchronize, reopened]

jobs:
  ci:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]

    steps:
      - name: Checkout
        # v4.2.2 (Verificado)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 
        with:
          fetch-depth: 0

      - name: Install Node.js
        # v4.2.0 (Verificado)
        uses: actions/setup-node@1d112162839d3823e164320b9971833d1623910b 
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        # Solução para o erro 404: Usar o Corepack nativo do Node.js.
        # Isso remove a dependência da Action externa que está falhando no download.
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

  sonarcloud:
    name: SonarCloud Scan
    needs: ci # Só executa se o Lint e Typecheck passarem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        # v4.2.1 (Verificado)
        uses: SonarSource/sonarqube-scan-action@724367c337b56d3575971a1792ca8a221f736024
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}