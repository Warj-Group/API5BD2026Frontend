name: Frontend CI, Patters & SonarCloud

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
    types: [opened, synchronize, reopened]

jobs:
  validate-git:
    name: Validar Git (Branch e Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checar Nome da Branch
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          REGEX="^(main|sprint-[0-9]+)$|^(feature|hotfix|release)\/WARJ-[0-9]+-.+$"
          if [[ ! $BRANCH =~ $REGEX ]]; then
            echo "::error::Nome de branch inválido ($BRANCH). Use feature/WARJ-X-nome, hotfix/ ou release/"
            exit 1
          fi
          echo "Nome da branch aprovado: $BRANCH"

      - name: Checar Padrão do Último Commit  
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          REGEX="^(feat|fix|doc|style|refactor|test|chore|ci)\/(WARJ-[0-9]+|main|sprint-[0-9]+): .+$"
          if [[ ! "$COMMIT_MSG" =~ $REGEX ]]; then
            echo "::error::Mensagem de commit fora do padrão! Ex: feat/WARJ-1: Descrição"
            exit 1
          fi
          # Extrai apenas a primeira linha da mensagem para o log ficar bonito
          PRIMEIRA_LINHA=$(echo "$COMMIT_MSG" | head -n 1)
          echo "Mensagem de commit aprovada: $PRIMEIRA_LINHA"

  ci:
    name: Lint & Typecheck
    needs: validate-git
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare Nuxt (Generate types)
        run: npx nuxi prepare

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test Production Build
        if: github.event_name == 'pull_request'
        run: npm run build

  sonarcloud:
    name: SonarCloud Scan
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@bfd4e558cda28cda6b5defafb9232d191be8c203
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}